name: Reel diário Astral Sem Dó

# Gera e publica o Reel curto (capa + 4 signos) a partir dos slides já
# commitados de manhã. Roda à tarde de propósito: segundo toque do dia no
# algoritmo, sem competir com o carrossel da manhã.
on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 18:00 BRT
    - cron: "0 23 * * *"   # 23:00 UTC = 20:00 BRT (retry; publicar_reel é idempotente)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reel-astral
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependências (ffmpeg já vem no runner)
        run: pip install requests pillow cairosvg

      - name: Conferir se os slides de HOJE existem
        id: hoje
        run: |
          HOJE=$(TZ=America/Sao_Paulo date +%Y%m%d)
          if [ -f "dados/reescrito-${HOJE}.json" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "sem reescrito de hoje — não vou publicar Reel de conteúdo velho."
          fi

      - name: Gerar Reel
        if: steps.hoje.outputs.ok == 'true'
        run: python3 automation/gerar_reel.py

      - name: Commit do vídeo (a Meta ingere via raw@SHA)
        if: steps.hoje.outputs.ok == 'true'
        id: commit
        run: |
          git config user.name  "astral-bot"
          git config user.email "actions@github.com"
          git add slides/reel.mp4 slides/caption-reel.txt
          git commit -m "reel do dia [skip ci]" || echo "nada novo pra commitar"
          git pull --rebase origin main
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publicar Reel no Instagram
        if: steps.hoje.outputs.ok == 'true'
        working-directory: automation/instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_SHA: ${{ steps.commit.outputs.sha }}
        run: python3 publicar_reel.py

      - name: Registrar publicação (commit do post_log)
        if: always() && steps.hoje.outputs.ok == 'true'
        run: |
          if git status --porcelain | grep -q "automation/instagram/post_log.json"; then
            git config user.name  "astral-bot"
            git config user.email "actions@github.com"
            git add automation/instagram/post_log.json
            git commit -m "log: reel do dia [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "Nada novo no post_log."
          fi
