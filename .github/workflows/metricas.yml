name: Métricas diárias Astral Sem Dó

# Loop de feedback: todo fim de noite coleta seguidores + insights dos posts
# dos últimos 7 dias e anexa em automation/instagram/metricas.csv (versionado).
on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 23:30 BRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metricas-astral
  cancel-in-progress: false

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependências
        run: pip install requests pillow

      - name: Coletar métricas
        working-directory: automation/instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 coletar_metricas.py

      - name: Commit do CSV
        run: |
          if git status --porcelain | grep -q "automation/instagram/metricas.csv"; then
            git config user.name  "astral-bot"
            git config user.email "actions@github.com"
            git add automation/instagram/metricas.csv
            git commit -m "métricas do dia [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "CSV sem mudanças."
          fi
